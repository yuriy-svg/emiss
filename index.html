<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light">
<title>Официальная статистика — прототип портала</title>
<meta name="description" content="Рабочий интерактивный прототип портала официальной статистической информации по Концепции 2.0. Каталог построен на полной онтологии ЕМИСС 2023.">
<style>
:root{
  --bg:#f4f7fb;--surface:#fff;--surface2:#f8fafd;--ink:#172238;--muted:#68778e;
  --line:#d9e1ec;--blue:#2257d6;--blue2:#eaf0ff;--cyan:#137a8a;--cyan2:#e8f7f8;
  --green:#198754;--green2:#eaf7f0;--amber:#9a6500;--amber2:#fff4d8;--red:#b33b3b;
  --red2:#fceaea;--violet:#6245b5;--violet2:#f0ebff;--dark:#162137;--shadow:0 12px 34px rgba(20,36,64,.09);
  --r:16px;--max:1280px
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
a{color:inherit;text-decoration:none}
button,input,select{font:inherit}
button{cursor:pointer}
.header{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.97);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.header__top{max-width:var(--max);margin:auto;height:72px;display:flex;align-items:center;gap:24px;padding:0 24px}
.logo{display:flex;align-items:center;gap:10px;min-width:225px;font-weight:800}
.logo__mark{width:36px;height:36px;border-radius:11px;background:linear-gradient(145deg,var(--blue),#7197ff);display:grid;place-items:center;color:#fff;font-weight:900}
.logo small{display:block;color:var(--muted);font-size:11px;font-weight:500;margin-top:-3px}
.nav{display:flex;gap:4px;flex:1}
.nav a{padding:10px 11px;border-radius:9px;font-size:13px;font-weight:650;color:#3a4961}
.nav a:hover,.nav a.active{background:var(--blue2);color:var(--blue)}
.header-search{width:220px;position:relative}
.header-search input{width:100%;height:40px;border:1px solid var(--line);background:var(--surface2);border-radius:10px;padding:0 38px 0 13px;outline:none}
.header-search input:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(34,87,214,.11)}
.header-search button{position:absolute;right:4px;top:4px;width:32px;height:32px;border:0;background:transparent;color:var(--blue);font-size:18px}
.mobile-menu{display:none;border:0;background:var(--blue2);color:var(--blue);width:40px;height:40px;border-radius:10px}
main{min-height:calc(100vh - 150px)}
.container{max-width:var(--max);margin:auto;padding:28px 24px 60px}
.breadcrumbs{display:flex;align-items:center;gap:7px;color:var(--muted);font-size:12px;margin-bottom:18px;flex-wrap:wrap}
.breadcrumbs a:hover{color:var(--blue)}
h1{font-size:36px;line-height:1.12;margin:0 0 12px;letter-spacing:-.6px}
h2{font-size:24px;margin:0 0 16px;letter-spacing:-.3px}
h3{font-size:18px;margin:0 0 8px}
.lead{font-size:17px;color:var(--muted);max-width:880px;margin:0 0 24px}
.muted{color:var(--muted)}
.small{font-size:12px}
.hero{padding:48px 0 18px}
.hero h1{font-size:46px;max-width:930px}
.hero-search{max-width:900px;display:flex;gap:10px;margin:28px 0 16px}
.hero-search input{flex:1;height:60px;border:2px solid #c9d4e5;background:#fff;border-radius:14px;padding:0 18px;font-size:17px;outline:none;box-shadow:var(--shadow)}
.hero-search input:focus{border-color:var(--blue)}
.btn{border:1px solid var(--blue);border-radius:10px;padding:10px 16px;background:#fff;color:var(--blue);font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:42px}
.btn:hover{background:var(--blue2)}
.btn--primary{background:var(--blue);color:#fff}
.btn--primary:hover{background:#1b48b5}
.btn--ghost{border-color:var(--line);color:var(--ink)}
.btn--danger{border-color:#e7bcbc;color:var(--red)}
.pill{display:inline-flex;align-items:center;border-radius:999px;padding:5px 9px;background:#eef2f7;color:#596b83;font-size:11px;font-weight:750;letter-spacing:.02em}
.pill--blue{background:var(--blue2);color:var(--blue)}
.pill--green{background:var(--green2);color:var(--green)}
.pill--amber{background:var(--amber2);color:var(--amber)}
.pill--violet{background:var(--violet2);color:var(--violet)}
.pill--red{background:var(--red2);color:var(--red)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:24px 0}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px}
.stat b{font-size:28px;display:block;line-height:1.1}
.stat span{color:var(--muted);font-size:12px}
.grid{display:grid;gap:16px}
.grid--2{grid-template-columns:repeat(2,minmax(0,1fr))}
.grid--3{grid-template-columns:repeat(3,minmax(0,1fr))}
.grid--4{grid-template-columns:repeat(4,minmax(0,1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;box-shadow:0 2px 8px rgba(20,36,64,.025)}
.card--click{transition:.15s transform,.15s box-shadow,.15s border-color}
.card--click:hover{transform:translateY(-2px);box-shadow:var(--shadow);border-color:#bdcbe0}
.card__top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.card__code{color:var(--blue);font-size:11px;font-weight:800}
.card__title{font-weight:780;font-size:17px;margin-top:3px}
.card__desc{color:var(--muted);font-size:13px;margin-top:7px}
.card__meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.section{margin-top:34px}
.section-head{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:15px}
.quick{background:linear-gradient(135deg,#e9f0ff,#f5f8ff);border:1px solid #c6d5ff;border-radius:18px;padding:22px}
.quick__value{font-size:34px;font-weight:850;margin:12px 0 2px}
.notice{border-radius:12px;padding:13px 15px;background:var(--amber2);border:1px solid #efd692;color:#6d4b00}
.notice--blue{background:var(--blue2);border-color:#cad7ff;color:#244b9b}
.notice--violet{background:var(--violet2);border-color:#d8ccff;color:#52399b}
.notice--green{background:var(--green2);border-color:#c4e7d3;color:#176943}
.results-layout{display:grid;grid-template-columns:260px 1fr;gap:20px}
.filters{position:sticky;top:100px;align-self:start}
.filter{margin-bottom:15px}
.filter label{font-size:12px;font-weight:700;display:block;margin-bottom:6px}
.filter select,.field,.filter input{width:100%;height:42px;border:1px solid var(--line);border-radius:9px;background:#fff;padding:0 11px;color:var(--ink)}
.search-results .card{margin-bottom:10px}
.path{color:var(--muted);font-size:12px;margin-top:5px}
.catalog-l1{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.catalog-l1 .card{min-height:132px}
.family-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.family{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px}
.family:hover{border-color:#b9c8df;box-shadow:0 7px 20px rgba(20,36,64,.06)}
.family__count{white-space:nowrap;color:var(--muted);font-size:11px}
.tabs{display:flex;gap:3px;border-bottom:1px solid var(--line);overflow-x:auto;margin:20px 0}
.tabs button{border:0;background:transparent;padding:11px 12px;color:var(--muted);font-weight:650;border-bottom:3px solid transparent;white-space:nowrap}
.tabs button.active{color:var(--blue);border-color:var(--blue)}
.metric-head{background:#fff;border:1px solid var(--line);border-radius:18px;padding:22px}
.metric-value{font-size:34px;font-weight:850;margin:10px 0}
.quality{background:var(--green2);border:1px solid #bfe3ce;border-radius:14px;padding:18px}
.quality-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:14px}
.quality-grid b{display:block;font-size:20px}
.chart{height:280px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px}
.chart svg{width:100%;height:100%}
.table-wrap{overflow:auto;background:#fff;border:1px solid var(--line);border-radius:12px}
table{width:100%;border-collapse:collapse;min-width:650px}
th,td{text-align:left;padding:11px 13px;border-bottom:1px solid var(--line);font-size:12px;vertical-align:top}
th{background:var(--surface2);color:#53647b;font-size:11px}
tr:last-child td{border-bottom:0}
.stepper{display:flex;align-items:center;gap:6px;margin:20px 0;overflow-x:auto}
.step{display:flex;align-items:center;gap:8px;color:var(--muted);white-space:nowrap}
.step:after{content:"";width:32px;height:1px;background:var(--line)}
.step:last-child:after{display:none}
.step__n{width:27px;height:27px;border-radius:50%;display:grid;place-items:center;background:#dfe6f0;font-size:11px;font-weight:800}
.step.active{color:var(--blue);font-weight:700}
.step.active .step__n,.step.done .step__n{background:var(--blue);color:#fff}
.selection{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.chip{padding:7px 10px;border-radius:9px;background:var(--blue2);color:var(--blue);font-size:12px;font-weight:650}
.two-col{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(320px,.7fr);gap:18px}
.timeline{display:flex;align-items:flex-start;gap:0;margin:28px 0}
.timeline__item{flex:1;position:relative;padding-top:27px;text-align:center;font-size:11px;color:var(--muted)}
.timeline__item:before{content:"";position:absolute;left:0;right:0;top:8px;height:3px;background:#dce4ef}
.timeline__item:first-child:before{left:50%}.timeline__item:last-child:before{right:50%}
.timeline__dot{width:18px;height:18px;border-radius:50%;background:var(--blue);position:absolute;top:0;left:calc(50% - 9px);z-index:2}
.timeline__item.current .timeline__dot{background:var(--violet);box-shadow:0 0 0 5px var(--violet2)}
.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.day{min-height:94px;background:#fff;border:1px solid var(--line);border-radius:9px;padding:8px;font-size:12px}
.day b{display:block}.day .event{font-size:10px;background:var(--blue2);color:var(--blue);border-radius:6px;padding:4px;margin-top:7px}
.day .event--amber{background:var(--amber2);color:var(--amber)}
.source-row{display:grid;grid-template-columns:1fr 110px 90px;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.source-row:last-child{border:0}
.footer{border-top:1px solid var(--line);background:#fff;color:var(--muted);font-size:12px}
.footer__inner{max-width:var(--max);margin:auto;padding:24px;display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap}
.modal-back{position:fixed;inset:0;background:rgba(10,20,38,.42);z-index:80;display:grid;place-items:center;padding:20px}
.modal{max-width:620px;width:100%;background:#fff;border-radius:18px;padding:24px;box-shadow:0 30px 100px rgba(0,0,0,.25)}
.modal-head{display:flex;justify-content:space-between;gap:15px}
.icon-btn{border:0;background:#eef2f7;border-radius:9px;width:36px;height:36px;font-size:18px}
.empty{text-align:center;padding:60px 20px;color:var(--muted)}
.kbd{border:1px solid var(--line);background:#fff;border-radius:6px;padding:2px 6px;font-size:11px}
.code{background:#111a2a;color:#dce7ff;padding:18px;border-radius:12px;font:12px/1.6 ui-monospace,SFMono-Regular,Menlo,monospace;white-space:pre-wrap;overflow:auto}
.mobile-only{display:none}
@media(max-width:1000px){
  .nav{display:none}.mobile-menu{display:block}.header-search{flex:1}.header__top{gap:10px}.logo{min-width:auto}.logo>div:last-child{display:none}
  .grid--4{grid-template-columns:repeat(2,1fr)}.grid--3{grid-template-columns:repeat(2,1fr)}
  .results-layout{grid-template-columns:1fr}.filters{position:static}
  .catalog-l1,.family-list,.two-col{grid-template-columns:1fr}
}
@media(max-width:650px){
  .container{padding:20px 16px 45px}.header__top{padding:0 14px}.header-search{display:none}
  h1{font-size:30px}.hero{padding-top:30px}.hero h1{font-size:35px}.hero-search{flex-direction:column}
  .hero-search .btn{height:50px}.stats,.grid--2,.grid--3,.grid--4,.quality-grid{grid-template-columns:1fr}
  .catalog-l1,.family-list{grid-template-columns:1fr}.metric-value{font-size:29px}
  .mobile-only{display:block}.source-row{grid-template-columns:1fr auto}
  .source-row>:nth-child(2){display:none}.calendar{grid-template-columns:repeat(2,1fr)}
}
</style>
</head>

function crumb(items){

}
function shell(html){ app.innerHTML=`<div class="container">${html}</div>`; window.scrollTo({top:0,behavior:'instant'}); }
function card(title,desc,href='',meta='',extra=''){
  return `<${href?'a':'div'} ${href?`href="${href}"`:''} class="card ${href?'card--click':''}">
    <div class="card__title">${esc(title)}</div><div class="card__desc">${desc}</div>${meta?`<div class="card__meta">${meta}</div>`:''}${extra}
  </${href?'a':'div'}>`;
}
function pill(s,c=''){return `<span class="pill ${c?`pill--${c}`:''}">${esc(s)}</span>`}
function familyHref(code){return `#/family/${encodeURIComponent(code)}`}
function topicHref(code){return `#/topic/${encodeURIComponent(code)}`}
function l2Href(code){return `#/theme/${encodeURIComponent(code)}`}

function spark(permanent=false){
  const vals = permanent ? [142,145,143,148,151,150,154,157,156,160,159,163] : [110,114,112,119,123,121,126,128,127,132,135,134];
  const min=Math.min(...vals),max=Math.max(...vals);
  const pts=vals.map((v,i)=>`${20+i*(560/(vals.length-1))},${230-(v-min)/(max-min)*170}`).join(' ');
  let second='';
  if(permanent){
    const vals2=vals.map((v,i)=>v-4+(i%3));
    const pts2=vals2.map((v,i)=>`${20+i*(560/(vals2.length-1))},${230-(v-(min-5))/(max-(min-5))*170}`).join(' ');
    second=`<polyline points="${pts2}" fill="none" stroke="#6245b5" stroke-width="3"/>`;
  }
  return `<div class="chart"><svg viewBox="0 0 600 250" preserveAspectRatio="none">
    ${[55,105,155,205].map(y=>`<line x1="20" y1="${y}" x2="580" y2="${y}" stroke="#e4eaf2"/>`).join('')}
    <polyline points="${pts}" fill="none" stroke="#2257d6" stroke-width="3"/>${second}
  </svg></div>`;
}

    DATA.l2.forEach(x=>{if((x.name+' '+x.l1).toLowerCase().includes(qq))results.push({type:'Тема',name:x.name,path:`${x.l1} · ${fmt(x.indicators)} показателей`,href:l2Href(x.code)})});

    const top=DATA.families.slice().sort((a,b)=>b.indicators-a.indicators).slice(0,20);

  } else if(step===2){
    content=`<h2>Где?</h2><div class="grid grid--2">${['Российская Федерация','Федеральные округа','Субъекты РФ','Муниципальные образования'].map((x,i)=>card(x,i===0?'выбрано':'доступность зависит от показателя','',pill(i===0?'выбрано':'выбрать',i===0?'green':''))).join('')}</div>`;

    content=`<h2>Когда?</h2><div class="grid grid--2"><div class="card"><label>Период от</label><input class="field" value="2015"></div><div class="card"><label>Период до</label><input class="field" value="2026"></div></div>

  } else if(step===4){
    content=`<h2>Разрезы</h2><div class="grid grid--2">${['Пол / возраст','Виды экономической деятельности','Товары и услуги','Тип организации'].map(x=>`<div class="card"><b>${x}</b><select class="field" style="margin-top:10px"><option>Все доступные значения</option></select></div>`).join('')}</div>

    const sel=selected.map(byCode).filter(Boolean);

  }
  shell(`${crumb([{label:'Данные',href:'#/data'},{label:'Конструктор данных'}])}<h1>Конструктор данных</h1>
    <div class="stepper">${steps.map((x,i)=>`<div class="step ${i+1<step?'done':''} ${i+1===step?'active':''}"><span class="step__n">${i+1}</span>${x}</div>`).join('')}</div>
    <div class="card">${content}</div>
    <div style="display:flex;justify-content:space-between;margin-top:15px"><button class="btn" onclick="goBuilder(${Math.max(1,step-1)})" ${step===1?'disabled':''}>← Назад</button><button class="btn btn--primary" onclick="goBuilder(${Math.min(5,step+1)})">${step===5?'Готово':'Далее →'}</button></div>`);

    $('#builderFilter').oninput=e=>{
      const qq=e.target.value.toLowerCase();

      $('#builderFamilies').innerHTML=xs.map(f=>builderFamily(f,store.get('builderSelection',[]))).join('');

function route(){
  const raw=location.hash.slice(1)||'/';
  const [path,qs='']=raw.split('?');
  const parts=path.split('/').filter(Boolean).map(decodeURIComponent);
  document.querySelectorAll('.nav a').forEach(a=>a.classList.toggle('active',a.getAttribute('href')===`#/${parts[0]||''}`));
  if(parts.length===0)return home();
  if(parts[0]==='search')return searchPage(new URLSearchParams(qs).get('q')||'');
  if(parts[0]==='topics')return topics();
  if(parts[0]==='topic')return topic(parts[1]);
  if(parts[0]==='theme')return theme(parts[1]);
  if(parts[0]==='family')return familyPage(parts[1]);
  if(parts[0]==='indicator')return indicatorPage(parts[1],parts[2]||0);
  if(parts[0]==='data')return dataPage();
  if(parts[0]==='builder')return builder(Math.max(1,Math.min(5,+parts[1]||1)));
  if(parts[0]==='compare')return compare();
  if(parts[0]==='permanent' && parts[1]==='census')return permanentCensus();
  if(parts[0]==='permanent' && parts[1]==='history')return permanentHistory();
  if(parts[0]==='permanent')return permanent();
  if(parts[0]==='quality')return quality();
  if(parts[0]==='methodology')return methodology();
  if(parts[0]==='plain')return plain();
  if(parts[0]==='updates')return updates();
  if(parts[0]==='developers')return developers();
  if(parts[0]==='territories')return territories();
  if(parts[0]==='microdata')return microdata();
  if(parts[0]==='nsi' && parts[1]!=null)return nsiCard(parts[1]);
  if(parts[0]==='nsi')return nsi();
  if(parts[0]==='my')return myData();
  return notFound();
}
